name: Free bot health check
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: bot-health-check
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check bot health
        run: curl --fail --silent --show-error --retry 1 --retry-delay 5 --max-time 90 https://telegram-bot-1s9r.onrender.com/
